<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sidebar</title>
    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="shell">
      <div class="shell-card"></div>
      <aside class="sidebar">
        <button
          type="button"
          id="collapseBtn"
          class="collapse-btn"
          aria-label="Collapse sidebar"
          aria-expanded="true"
        >
          <i data-lucide="chevron-left" aria-hidden="true"></i>
        </button>

        <header class="brand">
          <span class="brand-mark">
            <img src="./dev_by_ashworth.png" alt="company logo" />
          </span>
          <span class="brand-name">Dev By Ash</span>
        </header>

        <div class="profile">
          <span class="avatar">
            <img src="./dev.png" alt="avatar" />
          </span>
          <span class="profile-name">
            <span class="name-full">Ashley Alexandar</span>
            <span class="name-initials" aria-hidden="true">AA</span>
          </span>
          <span class="profile-email">ashleyalexandar@gmail.com</span>
        </div>

        <ul class="nav">
          <li>
            <button type="button" aria-label="Profile">
              <i data-lucide="user-round" aria-hidden="true"></i>
              <span class="label" aria-hidden="true">Profile</span>
              <span class="tip" aria-hidden="true">Profile</span>
            </button>
          </li>
          <li>
            <button type="button" aria-label="Feature">
              <i data-lucide="sparkles" aria-hidden="true"></i>
              <span class="label" aria-hidden="true">Feature</span>
              <span class="tip" aria-hidden="true">Feature</span>
            </button>
          </li>
          <li>
            <button type="button" aria-label="Package">
              <i data-lucide="package" aria-hidden="true"></i>
              <span class="label" aria-hidden="true">Package</span>
              <span class="tip" aria-hidden="true">Package</span>
            </button>
          </li>
          <li>
            <button type="button" aria-label="Support">
              <i data-lucide="life-buoy" aria-hidden="true"></i>
              <span class="label" aria-hidden="true">Support</span>
              <span class="tip" aria-hidden="true">Support</span>
            </button>
          </li>
          <li>
            <button type="button" aria-label="Community">
              <i data-lucide="users-round" aria-hidden="true"></i>
              <span class="label" aria-hidden="true">Community</span>
              <span class="tip" aria-hidden="true">Community</span>
            </button>
          </li>
        </ul>

        <ul class="nav nav-exit">
          <li>
            <button type="button" aria-label="Exit">
              <i data-lucide="log-out" aria-hidden="true"></i>
              <span class="label" aria-hidden="true">Exit</span>
              <span class="tip" aria-hidden="true">Exit</span>
            </button>
          </li>
        </ul>
      </aside>
    </div>

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@1.41.0"></script>
    <script src="script.js"></script>
  </body>
</html>
